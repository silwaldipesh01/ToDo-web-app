<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ToDo App</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <main class="container">
        <header class="hero">
            <div>
                <h1>ToDo App</h1>
                <p>Clean UI with live updates via SignalR</p>
            </div>
            <div class="hero-badge">
                <span class="live-dot"></span>
                Live Sync Enabled
            </div>
        </header>

        <!-- FORM -->
        <section class="card">
            <div class="card-header">
                <div>
                    <h2>Add / Update Task</h2>
                    <p class="muted">Create a task or edit an existing one.</p>
                </div>
            </div>

            <form id="task-form" class="task-form">
                <input type="hidden" id="editMode" value="false" />

                <div class="form-grid">
                    <label>
                        Title *
                        <input id="title" required placeholder="Enter task title" />
                    </label>

                    <label>
                        Due Date
                        <input id="dueDate" type="date" />
                    </label>

                    <label class="full-width">
                        Description
                        <textarea id="description" placeholder="Enter task details"></textarea>
                    </label>

                    <label>
                        Due Time *
                        <input id="dueTime" type="time" step="1" required />
                    </label>

                    <label>
                        Priority
                        <select id="priority">
                            <option value="Low">Low</option>
                            <option value="Medium" selected>Medium</option>
                            <option value="High">High</option>
                        </select>
                    </label>

                    <label class="inline full-width">
                        <input type="checkbox" id="isCompleted" />
                        <span>Completed</span>
                    </label>
                </div>

                <div class="actions">
                    <button type="submit" id="submitBtn">Save Task</button>
                    <button type="button" id="clear-btn" class="secondary">Clear</button>
                </div>
            </form>
        </section>

        <!-- TASK LIST -->
        <section class="card">
            <div class="card-header">
                <div>
                    <h2>Tasks</h2>
                    <p class="muted">Changes appear automatically for all users.</p>
                </div>
                <button id="refresh-btn" class="secondary" type="button">Refresh</button>
            </div>

            <div id="tasks" class="task-list">
                <div class="empty-state">Loading tasks...</div>
            </div>
        </section>
    </main>

    <template id="task-row">
        <div class="task">
            <div class="task-main">
                <div class="task-title"></div>
                <div class="task-meta"></div>
                <div class="task-desc"></div>
            </div>

            <div class="task-actions">
                <button class="edit-btn" type="button">Edit</button>
                <button class="delete-btn danger" type="button">Delete</button>
            </div>
        </div>
    </template>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
